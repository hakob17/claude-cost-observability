name: Cost Report

# Runs when any developer pushes new usage data, or manually from the Actions tab.
on:
  push:
    paths:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: write

# Don't let concurrent pushes race the report commit.
concurrency:
  group: cost-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build cost report
        run: python report.py
      - name: Commit report
        run: |
          git config user.name "cost-report-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add REPORT.md report.html
          if git diff --cached --quiet; then
            echo "No change to report."
          else
            git commit -m "Update cost report [skip ci]"
            git push
          fi
